<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Confirmation • e‑Commerce</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </h:head>
    <h:body class="bg-gray-50 text-gray-900 min-h-screen">
        <ui:include src="/WEB-INF/includes/header.xhtml"/>

        <main class="max-w-3xl mx-auto px-4 py-16">
            <div class="bg-white border border-gray-200 rounded-lg p-8 text-center shadow-sm">
                <div class="text-3xl mb-3">✅</div>
                <h1 class="text-2xl font-semibold mb-2">Merci, votre commande a été validée</h1>
                <p class="text-gray-600 mb-6">Nous vous avons envoyé un récapitulatif par e‑mail si votre adresse est renseignée.</p>
                <div class="flex items-center justify-center gap-3">
                    <h:link outcome="/vues/vitrine.xhtml" styleClass="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-500">Continuer mes achats</h:link>
                    <h:link outcome="/vues/compte.xhtml" styleClass="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300">Voir mes commandes</h:link>
                </div>
            </div>
        </main>
    </h:body>
</f:view>
</html>
