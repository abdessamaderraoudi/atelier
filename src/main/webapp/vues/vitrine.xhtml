<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Vitrine • e‑Commerce</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </h:head>
    <h:body class="bg-gray-50 text-gray-900 min-h-screen">
        <ui:include src="/WEB-INF/includes/header.xhtml"/>

        <main class="max-w-6xl mx-auto px-4 py-8">
            <h1 class="text-2xl font-semibold mb-6">Vitrine</h1>

            <h:form>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <ui:repeat value="#{vitrineBean.produits}" var="p">
                        <div class="bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition p-4 flex flex-col">
                            <div class="mb-3">
                                <h2 class="text-lg font-medium text-gray-900">#{p.nom}</h2>
                                <p class="text-sm text-gray-600 line-clamp-2">#{p.description}</p>
                            </div>
                            <div class="mt-auto flex items-center justify-between">
                                <span class="text-indigo-700 font-semibold">#{p.prix} DH</span>
                                <div class="flex items-center gap-2">
                                    <h:commandButton value="Détail" action="#{vitrineBean.viewProduit(p.id)}"
                                                     styleClass="px-3 py-1.5 text-sm bg-gray-200 hover:bg-gray-300 rounded"/>
                                    <h:commandButton value="Ajouter" action="#{panierBean.ajouterAuPanier(p)}"
                                                     styleClass="px-3 py-1.5 text-sm bg-indigo-600 hover:bg-indigo-500 text-white rounded"/>
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                </div>
            </h:form>

            <h:panelGroup rendered="#{not empty vitrineBean.selectedProduit}" styleClass="mt-10">
                <div class="bg-white border rounded-lg p-6">
                    <h2 class="text-xl font-semibold mb-2">#{vitrineBean.selectedProduit.nom}</h2>
                    <p class="text-gray-700 mb-4">#{vitrineBean.selectedProduit.description}</p>
                    <div class="flex items-center gap-4">
                        <span class="text-indigo-700 font-semibold">#{vitrineBean.selectedProduit.prix} DH</span>
                        <h:form>
                            <h:commandButton value="Ajouter au panier" action="#{panierBean.ajouterAuPanier(vitrineBean.selectedProduit)}"
                                             styleClass="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded"/>
                        </h:form>
                    </div>
                </div>
            </h:panelGroup>
        </main>
    </h:body>
</f:view>
</html>
