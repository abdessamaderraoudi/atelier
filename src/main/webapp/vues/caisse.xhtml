<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Caisse • e‑Commerce</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </h:head>
    <h:body class="bg-gray-50 text-gray-900 min-h-screen">
        <ui:include src="/WEB-INF/includes/header.xhtml"/>

        <main class="max-w-4xl mx-auto px-4 py-8">
            <h1 class="text-2xl font-semibold mb-6">Caisse</h1>

            <h:panelGroup rendered="#{empty authBean.currentUser}" styleClass="bg-yellow-50 border border-yellow-200 rounded p-4 mb-6">
                <p class="text-yellow-800">Veuillez vous connecter pour continuer votre commande.</p>
                <div class="mt-2">
                    <h:link outcome="/vues/login.xhtml" styleClass="text-indigo-600 hover:underline">Se connecter</h:link>
                </div>
            </h:panelGroup>

            <h:panelGroup rendered="#{not empty authBean.currentUser}">
                <h:panelGroup rendered="#{empty panierBean.panier or empty panierBean.panier.lignes}">
                    <div class="bg-white border rounded p-6 text-gray-600">Votre panier est vide.
                        <div class="mt-2">
                            <h:link outcome="/vues/vitrine.xhtml" styleClass="text-indigo-600 hover:underline">Retour à la vitrine</h:link>
                        </div>
                    </div>
                </h:panelGroup>

                <h:panelGroup rendered="#{not empty panierBean.panier and not empty panierBean.panier.lignes}">
                    <div class="grid md:grid-cols-2 gap-6">
                        <section class="bg-white border rounded p-4">
                            <h2 class="font-semibold mb-3">Résumé du panier</h2>
                            <div class="divide-y">
                                <ui:repeat value="#{panierBean.panier.lignes}" var="ligne">
                                    <div class="py-3 flex items-start justify-between gap-4">
                                        <div>
                                            <div class="text-gray-900 font-medium">#{ligne.produit.nom}</div>
                                            <div class="text-gray-500 text-sm">x #{ligne.quantite}</div>
                                        </div>
                                        <div class="text-right">#{ligne.sousTotal} DH</div>
                                    </div>
                                </ui:repeat>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-gray-600">Total</span>
                                <span class="text-lg font-semibold text-indigo-700">#{panierBean.panier.total} DH</span>
                            </div>
                        </section>

                        <section class="bg-white border rounded p-4">
                            <h2 class="font-semibold mb-3">Adresse de livraison</h2>
                            <h:form>
                                <div class="space-y-3">
                                    <h:inputTextarea value="#{commandeBean.adresseLivraison}" required="true"
                                                     styleClass="w-full min-h-[120px] px-3 py-2 border rounded focus:outline-none focus:ring"
                                                     requiredMessage="L’adresse de livraison est requise"/>
                                    <h:commandButton value="Valider la commande" action="#{commandeBean.validerCommande}"
                                                     styleClass="w-full px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-500"/>
                                </div>
                            </h:form>
                        </section>
                    </div>
                </h:panelGroup>
            </h:panelGroup>
        </main>
    </h:body>
</f:view>
</html>
