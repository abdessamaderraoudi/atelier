<!DOCTYPE html>
<html lang="fr"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:f="jakarta.faces.core"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title>Connexion • e‑Commerce</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </h:head>
    <h:body class="bg-gray-50 text-gray-900 min-h-screen">
        <ui:include src="/WEB-INF/includes/header.xhtml"/>
        <main class="max-w-md mx-auto px-4 py-12">
            <div class="bg-white border border-gray-200 rounded-lg p-6 shadow-sm">
                <h1 class="text-xl font-semibold mb-4">Se connecter</h1>

                <h:panelGroup rendered="#{not empty authBean.currentUser}" styleClass="mb-4 text-green-700">
                    Connecté en tant que <strong>#{authBean.currentUser.email}</strong>.
                </h:panelGroup>

                <h:form>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm text-gray-700 mb-1">Email</label>
                            <h:inputText value="#{authBean.email}" styleClass="w-full px-3 py-2 border rounded focus:outline-none focus:ring"/>
                        </div>
                        <div>
                            <label class="block text-sm text-gray-700 mb-1">Mot de passe</label>
                            <h:inputSecret value="#{authBean.password}" styleClass="w-full px-3 py-2 border rounded focus:outline-none focus:ring"/>
                        </div>
                        <div class="flex items-center gap-2">
                            <h:commandButton value="Se connecter" action="#{authBean.login}"
                                             styleClass="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-500"/>
                            <h:commandButton value="Créer un compte" action="#{authBean.register}"
                                             styleClass="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"/>
                        </div>
                    </div>
                </h:form>

                <div class="mt-6 text-sm text-gray-600">
                    <h:link outcome="/vues/vitrine.xhtml" styleClass="text-indigo-600 hover:underline">Retour à la vitrine</h:link>
                </div>
            </div>
        </main>
    </h:body>
</f:view>
</html>
